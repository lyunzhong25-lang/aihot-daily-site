name: Feishu Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send simple Feishu text with cleaned secret
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          node <<'NODE'
          const cleanEnv = (value) => String(value || "").replace(/^\uFEFF/, "").trim();
          const webhook = cleanEnv(process.env.FEISHU_WEBHOOK);
          if (!webhook) throw new Error("FEISHU_WEBHOOK is empty");
          const payload = {
            msg_type: "text",
            content: {
              text: `AI HOT 飞书测试：GitHub Actions 已在北京时间 ${new Intl.DateTimeFormat("zh-CN", { timeZone: "Asia/Shanghai", dateStyle: "short", timeStyle: "medium" }).format(new Date())} 发出这条测试消息。`
            }
          };
          const response = await fetch(webhook, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload)
          });
          const text = await response.text();
          console.log(`Feishu text test response: ${text}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const json = JSON.parse(text);
          if (json.code !== 0 && json.StatusCode !== 0) throw new Error(text);
          NODE