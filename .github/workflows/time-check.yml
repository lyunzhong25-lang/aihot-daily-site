name: Timezone Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  check-time:
    runs-on: ubuntu-latest
    steps:
      - name: Print UTC and Beijing time
        run: |
          echo "Triggered at UTC: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Triggered at Beijing: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Expected Beijing schedule for production: daily 09:00 = UTC 01:00"